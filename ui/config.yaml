streamlit:
  page_title: "ARCOS-RJ Chat"
  page_icon: "random"
  layout: "wide"

theme:
  dark:
    background_color: "#0E1117"
    text_color: "#FAFAFA"
    input_bg: "#1E1E1E"
    input_text: "#FFFFFF"
    button_bg: "#1E1E1E"
    button_text: "#FAFAFA"
    status_bg: "#1E1E1E"
    code_bg: "#2B2B2B"
    code_text: "#FAFAFA"
    borders:
      user: "#4FC3F7"
      agent: "#81C784"
      error: "#E57373"
  light:
    background_color: "#FFFFFF"
    text_color: "#1F2328"
    input_bg: "#F0F2F6"
    input_text: "#1F2328"
    button_bg: "#0288D1"
    button_text: "#FFFFFF"
    status_bg: "#E3F2FD"
    code_bg: "#E8EAED"
    code_text: "#1F2328"
    borders:
      user: "#0288D1"
      agent: "#388E3C"
      error: "#D32F2F"

messages:
  session_ended: "Sessão encerrada. Digite '/reiniciar' para começar uma nova."
  goodbye: "Limpando arquivos temporários..."
  cleanup_success: "{mensagem}"
  cleanup_error: "Erro na limpeza: {erro}"
  processing: "Processando..."
  input_placeholder: "Digite..."
  button_label: "Enviar"
  you: "Você"
  arcos: "ARCOS"
  error_label: "Erro"

commands:
  exit:
    trigger: "/sair"
    description: "Encerrar sessão"
  restart:
    trigger: "/reiniciar"
    description: "Reiniciar sessão"

paths:
  temp_folder: "./temp"
  db: "./db/sessions.db"
